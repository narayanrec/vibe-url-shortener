<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f8f5">
  <title>Your links — Linklet</title>
  <style>
    :root { color-scheme:light; --ink:#15231e; --muted:#69766f; --green:#236b4b; --line:#dfe5dc; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; color:var(--ink); background:#f7f8f5; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .shell { max-width:1000px; padding:28px 32px 56px; margin:auto; }
    header { display:flex; align-items:center; justify-content:space-between; }
    .brand { display:flex; align-items:center; gap:10px; color:var(--ink); font-size:19px; font-weight:750; letter-spacing:-.7px; text-decoration:none; }
    .brand-mark { display:grid; place-items:center; width:34px; height:34px; border-radius:11px; color:#fff; background:var(--green); }
    .brand-mark svg { width:19px; height:19px }
    .back { color:var(--green); font-size:13px; font-weight:700; text-decoration:none; }
    .back:hover { text-decoration:underline; }
    main { max-width:820px; margin:76px auto 0; }
    .eyebrow { color:var(--green); font-size:12px; font-weight:750; letter-spacing:1.15px; text-transform:uppercase; }
    h1 { margin:12px 0 8px; font-size:clamp(36px,5vw,52px); letter-spacing:-2.5px; line-height:1.05; }
    .intro { margin:0; color:var(--muted); font-size:15px; line-height:1.6; }
    .list-card { margin-top:30px; overflow:hidden; border:1px solid #e5e9e2; border-radius:18px; background:#fff; box-shadow:0 18px 50px #203b2b0c,0 2px 8px #203b2b08; }
    .list-head { display:flex; align-items:center; justify-content:space-between; padding:19px 22px; border-bottom:1px solid #edf0eb; }
    .list-head strong { font-size:14px; }
    .count { color:#69766f; font-size:12px; }
    .entry { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) auto; align-items:center; gap:22px; padding:18px 22px; border-bottom:1px solid #edf0eb; }
    .entry:last-child { border-bottom:0; }
    .field { min-width:0; }
    .field-label { display:block; margin-bottom:5px; color:#89948c; font-size:10px; font-weight:750; letter-spacing:.7px; text-transform:uppercase; }
    .field a { display:block; overflow:hidden; color:var(--green); font-size:13px; font-weight:700; text-decoration:none; text-overflow:ellipsis; white-space:nowrap; }
    .field.original a { color:#4f5c54; font-weight:450; }
    .field a:hover { text-decoration:underline; }
    .copy { padding:8px 11px; border:1px solid #dce5da; border-radius:8px; color:#365b40; background:#fff; font:inherit; font-size:11px; font-weight:700; cursor:pointer; }
    .copy:hover { color:#fff; background:var(--green); }
    .empty { padding:54px 24px; color:var(--muted); text-align:center; }
    .empty strong { display:block; margin-bottom:7px; color:var(--ink); font-size:16px; }
    .empty a { color:var(--green); font-weight:700; }
    .loading,.error { padding:30px; color:var(--muted); text-align:center; }
    @media(max-width:650px) { .shell { padding:22px 18px 36px } main { margin-top:55px } .entry { grid-template-columns:minmax(0,1fr) auto; gap:14px; padding:16px } .entry .original { grid-column:1 / -1; grid-row:2 } .entry .copy { grid-column:2; grid-row:1 } .list-head { padding:16px } }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.07 0l3-3A5 5 0 0 0 13 2.93l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.07 0l-3 3A5 5 0 0 0 11 21.07l1.72-1.71"/></svg></span>linklet</a>
      <a class="back" href="/">← Shorten a link</a>
    </header>
    <main>
      <div class="eyebrow">Your Linklet library</div>
      <h1>Your links</h1>
      <p class="intro">Every link you’ve created, all in one place.</p>
      <section class="list-card" aria-label="Created links">
        <div class="list-head"><strong>Created links</strong><span class="count" id="count"></span></div>
        <div id="list" class="loading" aria-live="polite">Loading your links…</div>
      </section>
    </main>
  </div>
  <script>
    const list = document.querySelector('#list');
    const count = document.querySelector('#count');

    function makeEntry(link) {
      const entry = document.createElement('article');
      entry.className = 'entry';
      const shortField = document.createElement('div');
      shortField.className = 'field';
      const shortLabel = document.createElement('span');
      shortLabel.className = 'field-label';
      shortLabel.textContent = 'Short link';
      const shortAnchor = document.createElement('a');
      shortAnchor.href = link.shortUrl;
      shortAnchor.textContent = link.shortUrl;
      shortField.append(shortLabel, shortAnchor);

      const originalField = document.createElement('div');
      originalField.className = 'field original';
      const originalLabel = document.createElement('span');
      originalLabel.className = 'field-label';
      originalLabel.textContent = 'Original URL';
      const originalAnchor = document.createElement('a');
      originalAnchor.href = link.originalUrl;
      originalAnchor.target = '_blank';
      originalAnchor.rel = 'noopener noreferrer';
      originalAnchor.title = link.originalUrl;
      originalAnchor.textContent = link.originalUrl;
      originalField.append(originalLabel, originalAnchor);

      const copy = document.createElement('button');
      copy.className = 'copy';
      copy.type = 'button';
      copy.textContent = 'Copy';
      copy.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(link.shortUrl);
          copy.textContent = 'Copied!';
        } catch {
          copy.textContent = 'Copy unavailable';
        }
        window.setTimeout(() => { copy.textContent = 'Copy'; }, 1600);
      });
      entry.append(shortField, originalField, copy);
      return entry;
    }

    fetch('/api/links')
      .then((response) => {
        if (!response.ok) throw new Error('Could not load your links. Please refresh to try again.');
        return response.json();
      })
      .then(({ links }) => {
        count.textContent = `${links.length} ${links.length === 1 ? 'link' : 'links'}`;
        list.className = '';
        list.replaceChildren();
        if (links.length === 0) {
          list.className = 'empty';
          const title = document.createElement('strong');
          title.textContent = 'No links yet';
          const message = document.createElement('span');
          message.textContent = 'Create your first short link and it’ll show up here. ';
          const link = document.createElement('a');
          link.href = '/';
          link.textContent = 'Shorten a link';
          list.append(title, message, link);
          return;
        }
        links.reverse().forEach((link) => list.append(makeEntry(link)));
      })
      .catch((error) => {
        list.className = 'error';
        list.textContent = error.message;
      });
  </script>
</body>
</html>
